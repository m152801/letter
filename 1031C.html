<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b070e" />
<title>见字如面 · A Letter for You</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
  /* ==========================================================
     基础重置
     ========================================================== */
  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
    color: #f6e7db;
    /* 深紫 → 酒红 → 墨黑的暮色渐变，营造夜色氛围 */
    background:
      radial-gradient(ellipse 90% 65% at 50% -10%, #2e1b31 0%, rgba(46, 27, 49, 0) 62%),
      radial-gradient(ellipse 75% 60% at 85% 105%, #3d1f27 0%, rgba(61, 31, 39, 0) 60%),
      radial-gradient(ellipse 60% 50% at 10% 92%, #241428 0%, rgba(36, 20, 40, 0) 60%),
      #0b070e;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ==========================================================
     舞台
     ========================================================== */
  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 20px;
    overflow: hidden;
  }

  /* 四角暗角，让视线聚焦中央 */
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 78% 70% at 50% 50%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, .55) 100%);
    z-index: 3;
  }

  /* ---------- 极光光晕 ---------- */
  .aura {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    will-change: transform;
  }
  .aura-1 {
    width: 62vmax; height: 62vmax;
    left: -14vmax; top: -20vmax;
    background: radial-gradient(circle, rgba(214, 110, 140, .34) 0%, rgba(214, 110, 140, 0) 68%);
    animation: drift1 24s ease-in-out infinite;
  }
  .aura-2 {
    width: 72vmax; height: 72vmax;
    right: -22vmax; bottom: -28vmax;
    background: radial-gradient(circle, rgba(198, 140, 88, .26) 0%, rgba(198, 140, 88, 0) 68%);
    animation: drift2 30s ease-in-out infinite;
  }
  .aura-3 {
    width: 40vmax; height: 40vmax;
    left: 40%; top: 55%;
    background: radial-gradient(circle, rgba(120, 100, 200, .16) 0%, rgba(120, 100, 200, 0) 70%);
    animation: drift1 34s ease-in-out infinite reverse;
  }

  @keyframes drift1 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50%      { transform: translate3d(6vmax, 4vmax, 0) scale(1.14); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1.06); }
    50%      { transform: translate3d(-6vmax, -4vmax, 0) scale(.94); }
  }

  /* ---------- 浮尘粒子画布 ---------- */
  #dust {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* ==========================================================
     信笺卡片
     ========================================================== */
  .letter {
    position: relative;
    z-index: 2;
    width: min(88vw, 440px);
    padding: clamp(38px, 9vw, 60px) clamp(22px, 7vw, 44px);
    border-radius: 3px;
    background:
      linear-gradient(158deg,
        rgba(255, 238, 226, .075) 0%,
        rgba(255, 214, 196, .026) 46%,
        rgba(255, 238, 226, .055) 100%);
    border: 1px solid rgba(255, 210, 182, .16);
    box-shadow:
      0 40px 90px -34px rgba(0, 0, 0, .95),
      0 0 70px rgba(255, 150, 120, .06),
      inset 0 1px 0 rgba(255, 235, 220, .07);
    cursor: pointer;
    transition: box-shadow .7s ease, transform .7s ease, border-color .7s ease;
    -webkit-tap-highlight-color: transparent;
  }

  /* 内层细描边，像信笺的印刷框 */
  .letter::before {
    content: "";
    position: absolute;
    inset: 9px;
    border: 1px solid rgba(255, 214, 190, .11);
    border-radius: 1px;
    pointer-events: none;
  }

  .letter:hover {
    border-color: rgba(255, 214, 190, .28);
    box-shadow:
      0 46px 100px -34px rgba(0, 0, 0, .95),
      0 0 90px rgba(255, 150, 120, .1),
      inset 0 1px 0 rgba(255, 235, 220, .1);
  }

  .letter:focus-visible {
    outline: 1px solid rgba(255, 210, 182, .5);
    outline-offset: 6px;
  }

  .letter.opened { cursor: default; }

  /* 点击时的柔光迸发 */
  .flash {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: radial-gradient(circle at 50% 50%, rgba(255, 226, 200, .55), rgba(255, 200, 170, 0) 65%);
    opacity: 0;
    z-index: 5;
  }
  .flash.on {
    animation: flashOut 1.15s cubic-bezier(.22, .61, .36, 1) forwards;
  }
  @keyframes flashOut {
    0%   { opacity: 0;   transform: scale(.55); }
    22%  { opacity: .95; }
    100% { opacity: 0;   transform: scale(1.7); }
  }

  /* ==========================================================
     双层面板（叠放，高度取最大值，切换不跳动）
     ========================================================== */
  .panels { display: grid; }

  .panel {
    grid-area: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  /* ---------- 封面层 ---------- */
  .panel-cover {
    pointer-events: auto;
    transition: opacity .7s ease, transform .7s ease, filter .7s ease;
  }
  .letter.opened .panel-cover {
    opacity: 0;
    transform: translateY(-12px) scale(1.03);
    filter: blur(3px);
    pointer-events: none;
    transition-duration: .55s;
  }

  /* ---------- 内文层 ---------- */
  .panel-body {
    opacity: 0;
    transform: translateY(18px);
    pointer-events: none;
    transition: opacity .85s ease .28s, transform .85s ease .28s;
  }
  .letter.opened .panel-body {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  /* ==========================================================
     文字排版
     ========================================================== */
  .eyebrow {
    margin: 0 0 clamp(20px, 5.5vw, 30px);
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 10.5px;
    font-weight: 400;
    letter-spacing: .44em;
    text-indent: .44em;
    text-transform: uppercase;
    color: rgba(255, 206, 178, .52);
  }

  .title {
    margin: 0;
    font-size: clamp(32px, 9.2vw, 52px);
    font-weight: 400;
    letter-spacing: .18em;
    text-indent: .18em;
    line-height: 1.25;
    color: #fdeade;
    text-shadow:
      0 0 26px rgba(255, 186, 152, .32),
      0 0 70px rgba(255, 150, 130, .16);
  }

  /* 分隔线：细线 + 菱形 */
  .rule {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    width: 100%;
    margin: clamp(20px, 5.5vw, 30px) 0;
  }
  .rule span {
    flex: 0 1 auto;
    width: clamp(30px, 13vw, 62px);
    height: 1px;
    background: linear-gradient(90deg, rgba(255, 210, 180, 0), rgba(255, 210, 180, .52));
  }
  .rule span:last-child {
    background: linear-gradient(90deg, rgba(255, 210, 180, .52), rgba(255, 210, 180, 0));
  }
  .rule i {
    display: block;
    width: 5px;
    height: 5px;
    background: rgba(255, 206, 172, .78);
    transform: rotate(45deg);
    box-shadow: 0 0 10px rgba(255, 190, 150, .8);
  }

  .verse {
    margin: 0;
    font-size: clamp(13px, 3.7vw, 15.5px);
    font-weight: 300;
    line-height: 2.5;
    letter-spacing: .14em;
    text-indent: .14em;
    color: rgba(250, 226, 212, .74);
  }

  .hint {
    margin-top: clamp(30px, 8vw, 46px);
    font-size: 11.5px;
    font-weight: 300;
    letter-spacing: .34em;
    text-indent: .34em;
    color: rgba(255, 202, 172, .62);
    animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: .42; transform: translateY(0); }
    50%      { opacity: .95; transform: translateY(-2px); }
  }

  /* ---------- 内文 ---------- */
  .letter-text {
    margin: 0 0 1.5em;
    font-size: clamp(13px, 3.7vw, 15.5px);
    font-weight: 300;
    line-height: 2.35;
    letter-spacing: .1em;
    text-indent: .1em;
    color: rgba(250, 228, 214, .82);
  }
  .letter-text:last-of-type { margin-bottom: 0; }

  .sign {
    margin: 0;
    font-size: 12px;
    font-weight: 300;
    letter-spacing: .3em;
    text-indent: .3em;
    color: rgba(255, 202, 172, .68);
  }

  .close {
    margin-top: clamp(26px, 7vw, 36px);
    padding: 9px 26px;
    font-family: inherit;
    font-size: 11.5px;
    letter-spacing: .3em;
    text-indent: .3em;
    color: rgba(255, 210, 184, .68);
    background: transparent;
    border: 1px solid rgba(255, 210, 180, .22);
    border-radius: 999px;
    cursor: pointer;
    transition: color .4s ease, border-color .4s ease, background .4s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .close:hover,
  .close:focus-visible {
    color: #ffe9dc;
    border-color: rgba(255, 210, 180, .58);
    background: rgba(255, 200, 170, .06);
    outline: none;
  }

  /* ==========================================================
     小屏微调
     ========================================================== */
  @media (max-height: 620px) {
    .letter { padding-top: 30px; padding-bottom: 30px; }
    .verse { line-height: 2.1; }
    .hint  { margin-top: 22px; }
    .rule  { margin: 16px 0; }
  }

  /* 尊重系统「减少动态效果」偏好 */
  @media (prefers-reduced-motion: reduce) {
    .aura, .hint { animation: none; }
    .hint { opacity: .8; }
    *, *::before, *::after {
      transition-duration: .01ms !important;
      animation-duration: .01ms !important;
    }
  }
</style>
</head>

<body>
  <div class="stage">
    <!-- 氛围光晕 -->
    <div class="aura aura-1"></div>
    <div class="aura aura-2"></div>
    <div class="aura aura-3"></div>

    <!-- 浮尘 -->
    <canvas id="dust" aria-hidden="true"></canvas>

    <!-- 信笺 -->
    <main class="letter" id="letter" role="button" tabindex="0" aria-label="轻触开启这封信">
      <div class="panels">

        <!-- ============ 封面 ============ -->
        <section class="panel panel-cover">
          <p class="eyebrow">A Letter For You</p>
          <h1 class="title">见字如面</h1>
          <div class="rule"><span></span><i></i><span></span></div>
          <p class="verse">
            我把今夜的风、月色与心跳<br />
            一并折进这封信里
          </p>
          <p class="hint">轻触 · 开启</p>
        </section>

        <!-- ============ 内文 ============ -->
        <section class="panel panel-body">
          <p class="eyebrow">For You, Always</p>
          <p class="letter-text">
            在遇见你之前，<br />
            我的世界只是昼夜的更替。
          </p>
          <p class="letter-text">
            遇见你之后，<br />
            每一场日落，<br />
            都有了姓名。
          </p>
          <div class="rule"><span></span><i></i><span></span></div>
          <p class="sign">愿以余生 · 共此长夜</p>
          <button class="close" id="close" type="button">合 上</button>
        </section>

      </div>
    </main>
  </div>

<script>
(function () {
  "use strict";

  /* =========================================================
     1. 浮尘粒子
     ========================================================= */
  var canvas = document.getElementById("dust");
  var ctx = canvas.getContext("2d");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var W = 0, H = 0, dpr = 1;
  var particles = [];
  var sprite = null;
  var rafId = null;

  /* 预渲染一枚柔光光斑，避免每帧创建渐变 —— 移动端更流畅 */
  function buildSprite() {
    var size = 64;
    var c = document.createElement("canvas");
    c.width = c.height = size;
    var g = c.getContext("2d");
    var grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grd.addColorStop(0,    "rgba(255, 244, 228, 0.95)");
    grd.addColorStop(0.30, "rgba(255, 208, 172, 0.42)");
    grd.addColorStop(1,    "rgba(255, 170, 140, 0)");
    g.fillStyle = grd;
    g.beginPath();
    g.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
    g.fill();
    return c;
  }

  function makeParticle(atRandomHeight) {
    return {
      x: Math.random() * W,
      y: atRandomHeight ? Math.random() * H : H + 20,
      size: 4 + Math.random() * 9,          // 绘制直径
      vx: (Math.random() - 0.5) * 0.14,
      vy: -(0.08 + Math.random() * 0.26),
      alpha: 0.14 + Math.random() * 0.46,
      phase: Math.random() * Math.PI * 2,
      speed: 0.006 + Math.random() * 0.018
    };
  }

  function spawnParticles() {
    /* 依据屏幕面积决定数量：手机少、电脑多 */
    var count = Math.round(Math.min(90, Math.max(26, (W * H) / 17000)));
    if (reduced) count = Math.round(count * 0.4);
    particles = [];
    for (var i = 0; i < count; i++) {
      particles.push(makeParticle(true));
    }
  }

  function resizeCanvas() {
    var rect = canvas.getBoundingClientRect();
    W = rect.width  || window.innerWidth;
    H = rect.height || window.innerHeight;

    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    spawnParticles();
    if (reduced) renderOnce();
  }

  function renderOnce() {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = p.alpha;
      ctx.drawImage(sprite, p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];

      p.x += p.vx;
      p.y += p.vy;
      p.phase += p.speed;

      /* 飘出边界后从底部重生 */
      if (p.y < -30 || p.x < -40 || p.x > W + 40) {
        particles[i] = makeParticle(false);
        continue;
      }

      var flicker = 0.55 + 0.45 * Math.sin(p.phase);   // 明暗呼吸
      ctx.globalAlpha = p.alpha * flicker;
      ctx.drawImage(sprite, p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    rafId = requestAnimationFrame(tick);
  }

  /* =========================================================
     2. 信笺交互
     ========================================================= */
  var letter = document.getElementById("letter");
  var closeBtn = document.getElementById("close");

  function openLetter() {
    if (letter.classList.contains("opened")) return;
    letter.classList.add("opened");
    letter.setAttribute("aria-label", "信件已开启");

    /* 柔光迸发 */
    var flash = document.createElement("div");
    flash.className = "flash";
    letter.appendChild(flash);
    flash.addEventListener("animationend", function () {
      if (flash.parentNode) flash.parentNode.removeChild(flash);
    });

    /* 震动反馈（支持该 API 的安卓设备） */
    if (navigator.vibrate) {
      try { navigator.vibrate(12); } catch (e) {}
    }
  }

  function closeLetter() {
    letter.classList.remove("opened");
    letter.setAttribute("aria-label", "轻触开启这封信");
  }

  letter.addEventListener("click", function (e) {
    /* 点击「合上」按钮时不触发开启 */
    if (e.target === closeBtn) return;
    openLetter();
  });

  closeBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    closeLetter();
  });

  letter.addEventListener("keydown", function (e) {
    var isEnter = e.key === "Enter" || e.key === " " || e.key === "Spacebar";
    if (isEnter && !letter.classList.contains("opened")) {
      e.preventDefault();
      openLetter();
    } else if (e.key === "Escape" && letter.classList.contains("opened")) {
      closeLetter();
    }
  });

  /* =========================================================
     3. 启动 & 自适应
     ========================================================= */
  function init() {
    sprite = buildSprite();
    resizeCanvas();
    if (!reduced) rafId = requestAnimationFrame(tick);
  }

  var resizeTimer = null;
  function onResize() {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeCanvas, 160);
  }

  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", onResize);

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  /* 页面切到后台时暂停动画，省电 */
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    } else if (!reduced && !rafId) {
      rafId = requestAnimationFrame(tick);
    }
  });
})();
</script>
</body>
</html>
